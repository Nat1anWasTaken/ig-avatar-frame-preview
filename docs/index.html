<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Avatar Frame Preview</title>
<meta name="description" content="上傳大頭貼與頭像框，立即預覽在 Instagram 各處的樣子。所有處理都在你的瀏覽器內完成。">
<style>
:root {
  --bg: #f6f6f8;
  --surface: #ffffff;
  --surface-2: #eeeef2;
  --text: #17171c;
  --muted: #62626e;
  --border: #dcdce3;
  --accent: #5b4bd6;
  --accent-text: #ffffff;
  --shadow: 0 1px 2px rgba(0,0,0,.06), 0 8px 24px rgba(0,0,0,.06);
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e0e12;
    --surface: #18181f;
    --surface-2: #23232c;
    --text: #ececf1;
    --muted: #a0a0ad;
    --border: #2f2f3a;
    --accent: #8b7ff0;
    --accent-text: #0e0e12;
    --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.3);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e0e12; --surface: #18181f; --surface-2: #23232c; --text: #ececf1; --muted: #a0a0ad;
  --border: #2f2f3a; --accent: #8b7ff0; --accent-text: #0e0e12; --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.3);
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  margin: 0; background: var(--bg); color: var(--text);
  font: 15px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", sans-serif;
}
.wrap { max-width: 1240px; margin: 0 auto; padding: 32px 16px 64px; }
header h1 { font-size: 28px; line-height: 1.2; margin: 0 0 6px; letter-spacing: -.01em; }
header p { margin: 0; color: var(--muted); max-width: 60ch; }

.layout { display: grid; grid-template-columns: 320px minmax(0, 1fr); gap: 28px; margin-top: 28px; align-items: start; }
@media (max-width: 900px) { .layout { grid-template-columns: minmax(0, 1fr); } }

.panel {
  background: var(--surface); border: 1px solid var(--border); border-radius: 16px; box-shadow: var(--shadow);
  padding: 20px; position: sticky; top: 16px;
}
@media (max-width: 900px) { .panel { position: static; } }
.panel h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 0 0 10px; font-weight: 600; }
.step + .step { margin-top: 20px; padding-top: 20px; border-top: 1px solid var(--border); }

.composite { display: grid; place-items: center; margin-bottom: 4px; }
.composite canvas {
  width: 200px; height: 200px; border-radius: 50%; background: var(--surface-2);
  cursor: grab; touch-action: none; box-shadow: 0 0 0 1px var(--border);
}
.composite canvas:active { cursor: grabbing; }
.hint { font-size: 13px; color: var(--muted); text-align: center; margin: 8px 0 0; }

.drop {
  display: flex; align-items: center; gap: 12px; padding: 12px; border: 1.5px dashed var(--border);
  border-radius: 12px; cursor: pointer; transition: border-color .15s, background .15s;
}
.drop:hover, .drop.over { border-color: var(--accent); background: var(--surface-2); }
.drop input { position: absolute; width: 1px; height: 1px; opacity: 0; pointer-events: none; }
.drop .thumb { width: 44px; height: 44px; border-radius: 10px; background: var(--surface-2) center/cover no-repeat; flex: none; }
.drop .label { min-width: 0; }
.drop .label strong { display: block; font-size: 14px; }
.drop .label span { display: block; font-size: 12.5px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.chips { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
.chip {
  font: inherit; font-size: 13px; padding: 5px 12px; border-radius: 999px; border: 1px solid var(--border);
  background: var(--surface); color: var(--text); cursor: pointer;
}
.chip[aria-pressed="true"] { background: var(--text); color: var(--bg); border-color: var(--text); }

.slider { display: grid; grid-template-columns: 44px 1fr; align-items: center; gap: 10px; font-size: 13px; color: var(--muted); }
.slider + .slider { margin-top: 6px; }
.slider input { width: 100%; accent-color: var(--accent); }

.btn {
  display: block; width: 100%; font: inherit; font-weight: 600; padding: 11px 14px; border-radius: 12px; border: 0;
  background: var(--accent); color: var(--accent-text); cursor: pointer; margin-top: 12px;
}
.btn.secondary { background: var(--surface-2); color: var(--text); }

section.group + section.group { margin-top: 40px; }
section.group > h2 { font-size: 20px; margin: 0 0 4px; }
section.group > p { margin: 0 0 16px; color: var(--muted); font-size: 14px; }

.closeups { display: flex; flex-wrap: wrap; align-items: flex-start; gap: 14px; margin-bottom: 22px; }
.closeup figure, figure.closeup { margin: 0; }
figure.closeup {
  background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 10px; box-shadow: var(--shadow);
}
figure.closeup figcaption, .scene figcaption { font-size: 13px; color: var(--muted); margin-top: 8px; }
.viewport { position: relative; overflow: hidden; border-radius: 8px; background: #0c1014; }
.viewport iframe {
  position: absolute; left: 0; top: 0; border: 0; transform-origin: 0 0; pointer-events: none; background: #0c1014;
}

.scenes { display: grid; gap: 18px; }
.scenes.desktop { grid-template-columns: minmax(0, 1fr); }
.scenes.mobile { grid-template-columns: repeat(auto-fill, minmax(260px, 340px)); }
.scene { margin: 0; }
.scene .viewport { border-radius: 12px; box-shadow: var(--shadow); }
.scenes.mobile .viewport { border-radius: 28px; outline: 6px solid var(--surface-2); outline-offset: 0; }

footer { margin-top: 48px; color: var(--muted); font-size: 13px; }
footer a { color: inherit; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>頭像框預覽</h1>
    <p>上傳你的大頭貼，再選一個頭像框，就能看到它在 Instagram 限時動態、摯友、貼文、私訊和便利貼裡的樣子。圖片只在你的瀏覽器裡處理，不會上傳。</p>
  </header>

  <div class="layout">
    <aside class="panel" aria-label="設定">
      <div class="step">
        <div class="composite">
          <canvas id="preview" width="1080" height="1080" aria-label="合成後的大頭貼，可拖曳調整位置"></canvas>
        </div>
        <p class="hint">拖曳圓圈可移動照片位置</p>
      </div>

      <div class="step">
        <h2>1 · 大頭貼</h2>
        <label class="drop" id="photoDrop">
          <input type="file" id="photoInput" accept="image/*">
          <span class="thumb" id="photoThumb"></span>
          <span class="label"><strong>選擇照片</strong><span id="photoName">點擊或拖曳圖片到這裡</span></span>
        </label>
        <div style="margin-top:12px">
          <label class="slider">縮放 <input type="range" id="zoom" min="1" max="3" step="0.01" value="1"></label>
        </div>
      </div>

      <div class="step">
        <h2>2 · 頭像框</h2>
        <label class="drop" id="frameDrop">
          <input type="file" id="frameInput" accept="image/png,image/webp,image/svg+xml,image/*">
          <span class="thumb" id="frameThumb"></span>
          <span class="label"><strong>選擇頭像框</strong><span id="frameName">中間透明的 PNG</span></span>
        </label>
        <div class="chips" role="group" aria-label="頭像框範本">
          <button class="chip" type="button" data-frame="assets/sitcon-2027-frame.png" aria-pressed="true">SITCON 2027</button>
          <button class="chip" type="button" data-frame="" aria-pressed="false">不加框</button>
        </div>
      </div>

      <div class="step">
        <button class="btn" type="button" id="download">下載合成後的大頭貼</button>
        <button class="btn secondary" type="button" id="reset">重設位置</button>
      </div>
    </aside>

    <main>
      <section class="group" id="desktop">
        <h2>電腦版</h2>
        <p>instagram.com 首頁與私訊</p>
        <div class="closeups" data-device="desktop"></div>
        <div class="scenes desktop" data-device="desktop"></div>
      </section>
      <section class="group" id="mobile">
        <h2>手機版</h2>
        <p>手機瀏覽器上的首頁與私訊</p>
        <div class="closeups" data-device="mobile"></div>
        <div class="scenes mobile" data-device="mobile"></div>
      </section>
    </main>
  </div>

  <footer>
    畫面是去識別化的 Instagram 網頁靜態快照，所有名稱、照片與內容都是佔位資料。Instagram 是 Meta 的商標，本工具與 Meta 無關。
  </footer>
</div>

<script>
const LABELS = {
  'home': '首頁', 'inbox': '私訊',
  'story-normal': '限時動態', 'story-close-friends': '摯友限時動態', 'post-author': '貼文作者',
  'own-sidebar': '右上角帳號', 'own-nav': '導覽列', 'note': '便利貼', 'chat-list': '聊天列表',
};
const $ = (s) => document.querySelector(s);

// ------------------------------------------------------------ compositing
const canvas = $('#preview');
const ctx = canvas.getContext('2d');
const S = canvas.width;
const state = { photo: null, frame: null, zoom: 1, dx: 0, dy: 0 };
let avatarUrl = 'assets/default-avatar.png';

const loadImage = (src) => new Promise((res, rej) => {
  const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = src;
});

function draw() {
  ctx.clearRect(0, 0, S, S);
  const p = state.photo;
  if (p) {
    const k = Math.max(S / p.width, S / p.height) * state.zoom;
    const w = p.width * k, h = p.height * k;
    // keep the photo covering the square, whatever the offset
    state.dx = Math.min(Math.max(state.dx, (S - w) / 2), (w - S) / 2);
    state.dy = Math.min(Math.max(state.dy, (S - h) / 2), (h - S) / 2);
    ctx.drawImage(p, (S - w) / 2 + state.dx, (S - h) / 2 + state.dy, w, h);
  }
  if (state.frame) ctx.drawImage(state.frame, 0, 0, S, S);
  scheduleExport();
}

let exportTimer;
function scheduleExport() {
  clearTimeout(exportTimer);
  exportTimer = setTimeout(() => canvas.toBlob((b) => {
    if (avatarUrl.startsWith('blob:')) URL.revokeObjectURL(avatarUrl);
    avatarUrl = URL.createObjectURL(b);
    applyAll();
  }, 'image/png'), 60);
}

// drag to reposition
let drag = null;
canvas.addEventListener('pointerdown', (e) => { drag = { x: e.clientX, y: e.clientY }; canvas.setPointerCapture(e.pointerId); });
canvas.addEventListener('pointermove', (e) => {
  if (!drag) return;
  const r = S / canvas.getBoundingClientRect().width;
  state.dx += (e.clientX - drag.x) * r; state.dy += (e.clientY - drag.y) * r;
  drag = { x: e.clientX, y: e.clientY };
  draw();
});
canvas.addEventListener('pointerup', () => { drag = null; });
$('#zoom').addEventListener('input', (e) => { state.zoom = +e.target.value; draw(); });
$('#reset').addEventListener('click', () => { state.zoom = 1; state.dx = state.dy = 0; $('#zoom').value = 1; draw(); });
$('#download').addEventListener('click', () => {
  const a = document.createElement('a'); a.href = avatarUrl; a.download = 'avatar-with-frame.png'; a.click();
});

function setupDrop(dropEl, input, onFile) {
  input.addEventListener('change', () => input.files[0] && onFile(input.files[0]));
  dropEl.addEventListener('dragover', (e) => { e.preventDefault(); dropEl.classList.add('over'); });
  dropEl.addEventListener('dragleave', () => dropEl.classList.remove('over'));
  dropEl.addEventListener('drop', (e) => {
    e.preventDefault(); dropEl.classList.remove('over');
    const f = e.dataTransfer.files[0]; if (f && f.type.startsWith('image/')) onFile(f);
  });
}
setupDrop($('#photoDrop'), $('#photoInput'), async (f) => {
  const url = URL.createObjectURL(f);
  state.photo = await loadImage(url);
  state.zoom = 1; state.dx = state.dy = 0; $('#zoom').value = 1;
  $('#photoThumb').style.backgroundImage = `url("${url}")`;
  $('#photoName').textContent = f.name;
  draw();
});
async function setFrame(src, name) {
  state.frame = src ? await loadImage(src) : null;
  $('#frameThumb').style.backgroundImage = src ? `url("${src}")` : 'none';
  $('#frameName').textContent = name;
  draw();
}
setupDrop($('#frameDrop'), $('#frameInput'), (f) => {
  document.querySelectorAll('.chip').forEach((c) => c.setAttribute('aria-pressed', 'false'));
  setFrame(URL.createObjectURL(f), f.name);
});
document.querySelectorAll('.chip').forEach((chip) => chip.addEventListener('click', () => {
  document.querySelectorAll('.chip').forEach((c) => c.setAttribute('aria-pressed', String(c === chip)));
  setFrame(chip.dataset.frame, chip.dataset.frame ? chip.textContent : '不加框');
}));

// ------------------------------------------------------------ scenes
const frames = [];
function applyTo(iframe) {
  const doc = iframe.contentDocument;
  if (!doc) return;
  doc.querySelectorAll('img[data-slot="avatar"]').forEach((img) => { img.src = avatarUrl; });
}
function applyAll() { frames.forEach(applyTo); }

// An iframe rendering a scene at its native viewport, scaled into `box`.
// With a crop, only that rectangle of the scene is shown.
function sceneView(scene, crop, maxWidth) {
  const box = document.createElement('div');
  box.className = 'viewport';
  const iframe = document.createElement('iframe');
  iframe.src = `scenes/${scene.id}.html`;
  iframe.title = `${scene.device} ${LABELS[scene.scene]}`;
  iframe.setAttribute('tabindex', '-1');
  iframe.width = scene.width; iframe.height = scene.height;
  iframe.addEventListener('load', () => applyTo(iframe));
  frames.push(iframe);
  box.appendChild(iframe);

  const fit = () => {
    const r = crop || { x: 0, y: 0, width: scene.width, height: scene.height };
    const avail = maxWidth ? Math.min(maxWidth, innerWidth - 64) : box.parentElement.clientWidth;
    const z = crop ? Math.min(avail / r.width, crop.zoom) : avail / r.width;
    box.style.width = `${r.width * z}px`;
    box.style.height = `${r.height * z}px`;
    iframe.style.transform = `scale(${z}) translate(${-r.x}px, ${-r.y}px)`;
  };
  new ResizeObserver(fit).observe(document.body);
  requestAnimationFrame(fit);
  return box;
}

(async () => {
  const scenes = await (await fetch('scenes.json')).json();
  for (const sc of scenes) {
    const fig = document.createElement('figure');
    fig.className = 'scene';
    $(`.scenes[data-device="${sc.device}"]`).appendChild(fig);
    fig.appendChild(sceneView(sc));
    fig.insertAdjacentHTML('beforeend', `<figcaption>${LABELS[sc.scene]}</figcaption>`);

    for (const c of sc.crops) {
      const card = document.createElement('figure');
      card.className = 'closeup';
      $(`.closeups[data-device="${sc.device}"]`).appendChild(card);
      // small spots get magnified more; large ones are capped by the card width
      const zoom = c.width < 160 ? (sc.device === 'mobile' ? 2 : 2.4) : 1.2;
      card.appendChild(sceneView(sc, { ...c, zoom }, 340));
      card.insertAdjacentHTML('beforeend', `<figcaption>${LABELS[c.name] || c.name} · ${LABELS[sc.scene]}</figcaption>`);
    }
  }
})();

// default: placeholder person inside the SITCON frame
(async () => {
  state.photo = await loadImage('assets/placeholder-avatar.png');
  await setFrame('assets/sitcon-2027-frame.png', 'SITCON 2027');
})();
</script>
</body>
</html>
